			(function () {
				function loadScript(src) {
					return new Promise(function (resolve, reject) {
						var existing = document.querySelector(
							'script[src="' + src + '"]',
						);
						if (existing) {
							resolve();
							return;
						}
						var script = document.createElement("script");
						script.src = src;
						script.async = false;
						script.onload = function () {
							resolve();
						};
						script.onerror = function () {
							reject(new Error("Failed to load " + src));
						};
						document.body.appendChild(script);
					});
				}

				function applyTopLayerStyles(container) {
					container.style.position = "fixed";
					container.style.zIndex = String(myspineRuntimeConfig.zIndex);
				}

				function initMySpine() {
					if (window.mySpineInitialized) return;

					var container = document.querySelector(".myspine-spine-widget");
					if (!container) return;

					loadScript(spineWidgetJs)
						.then(function () {
							return loadScript(spineBinaryJs);
						})
						.then(function () {
